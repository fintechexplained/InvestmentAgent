[tool.poetry]
name = "investment-agent"
version = "0.1.0"
description = "Multi-modal investment analysis agent"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.39.0"
openai = "^1.54.0"
faiss-cpu = "^1.7.4"
streamlit = "^1.39.0"
pydantic = "^2.9.0"
pydantic-ai = "^1.51.0"
ddgs = "^9.10.0"
python-dotenv = "^1.0.0"
numpy = "^1.26.0"
pillow = "^10.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
black = "^24.8.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
